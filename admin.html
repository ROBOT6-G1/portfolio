<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - DEVWEB STUDIO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0a041c] text-gray-100 min-h-screen p-6">

  <!-- Section Login Admin -->
  <div id="loginSection" class="max-w-md mx-auto mt-20 glass-card p-8 rounded-3xl space-y-6 text-center">
    <h1 class="text-2xl font-bold gradient-text">Espace Admin</h1>
    <p class="text-xs text-gray-400">Teny miafina par défaut: 1234</p>
    <input type="password" id="adminPassword" placeholder="Mampidira teny miafina" class="w-full bg-slate-900 border border-purple-900/50 p-3 rounded-xl text-center text-sm focus:outline-none text-white">
    <button onclick="loginAdmin()" class="w-full gradient-bg py-3 rounded-xl font-bold hover:opacity-90 transition">Miditra</button>
  </div>

  <!-- Dashboard Admin -->
  <div id="adminDashboard" class="hidden max-w-6xl mx-auto space-y-10">
    <div class="flex justify-between items-center border-b border-purple-900/30 pb-4">
      <h1 class="text-3xl font-extrabold gradient-text">Tableau de bord Admin</h1>
      <a href="index.html" class="text-xs bg-purple-900/40 text-purple-300 px-4 py-2 rounded-xl border border-purple-500/30">Miverina amin'ny Site</a>
    </div>

    <!-- Image Compressor Widget HTML5 Canvas -->
    <div class="glass-card p-6 rounded-2xl space-y-4">
      <h2 class="text-xl font-bold text-purple-300">🖼️ Compresseur & Uploader Sary Canvas (<150KB)</h2>
      <p class="text-xs text-gray-400">Fampidirana sary voazip mba tsy handany firestore storage.</p>
      <div class="flex items-center gap-4">
        <input type="file" accept="image/*" onchange="compressAndUpload(this, 'imgPreview')" class="text-sm text-gray-400">
        <img id="imgPreview" class="w-20 h-20 object-cover rounded-xl border border-purple-500/30 bg-slate-900" alt="Aperçu">
      </div>
    </div>

    <!-- Boîte de Réception Messages Firestore -->
    <div class="glass-card p-6 rounded-2xl space-y-4">
      <h2 class="text-xl font-bold text-purple-300">📬 Hafatra Voaray (Messages Firestore)</h2>
      <div id="messagesList" class="space-y-3">
        <p class="text-sm text-gray-500">Mampiditra ny hafatra...</p>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
